<!DOCTYPE html>
<html>
<head>
    <title>Option Chain Analyzer Bot</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; text-align: center; }
        .card { background: white; max-width: 500px; margin: auto; padding: 25px; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
        input[type="file"] { margin: 20px 0; width: 100%; }
        button { background: #007bff; color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; width: 100%; }
        button:hover { background: #0056b3; }
        .result { margin-top: 20px; background: #e9ecef; padding: 15px; border-radius: 5px; text-align: left; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Nifty Option Chain Analyzer</h2>
        <form method="POST" enctype="multipart/form-data">
            <input type="file" name="file" accept=".csv" required><br>
            <button type="submit">Upload & Analyze</button>
        </form>

        {% if signal %}
        <div class="result">
            <h3>Trade Signal Result:</h3>
            <p><b>Side:</b> {{ signal.Side }}</p>
            <p><b>Best Strike:</b> {{ signal.Strike }}</p>
            <p><b>Entry Price (LTP):</b> {{ signal.Entry }}</p>
            <p><b>Target (+30%):</b> {{ signal.Target }}</p>
            <p><b>Stop Loss (-20%):</b> {{ signal.StopLoss }}</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
